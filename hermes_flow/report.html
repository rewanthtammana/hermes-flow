<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hermes Flow</title><style>
:root{--ink:#193632;--muted:#647973;--line:#dbe4dc;--green:#176557}*{box-sizing:border-box}body{margin:0;background:#f5f7f2;color:var(--ink);font:14px/1.6 system-ui,sans-serif}header{padding:22px 32px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:15px}.mark{background:var(--green);color:white;padding:7px 15px;font-size:24px;border-radius:12px}header h1{font-size:19px;margin:0}header p{margin:0;font-size:12px;color:var(--muted)}.local{margin-left:auto;font:11px monospace;letter-spacing:1px;color:var(--green)}main{max-width:1600px;padding:30px;margin:auto}h2{font-size:32px;letter-spacing:-1px;margin:6px 0}h3{margin:0;font-size:18px}p{margin:7px 0}.muted{color:var(--muted)}.eyebrow{font:11px monospace;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}.intro{display:flex;justify-content:space-between;align-items:center;gap:15px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.metric,.panel{border:1px solid var(--line);border-radius:12px;background:white;overflow:hidden}.metric{padding:18px 22px}.metric b{display:block;font-size:28px;font-weight:550}.metric span{font-size:12px;color:var(--muted)}.notice{padding:15px 20px;border:1px solid #dfc99f;background:#fff7e7;border-radius:10px;margin-bottom:20px}.notice ul{margin:8px 0;padding-left:20px}.workspace{display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px}.panel-title{padding:18px;border-bottom:1px solid var(--line);font-weight:600}.sidebar input{margin:14px;width:calc(100% - 28px)}input,select,button{font:inherit}input,select,.secondary{padding:9px 12px;border:1px solid var(--line);border-radius:7px;background:white;color:var(--ink)}button{cursor:pointer}button:disabled{cursor:default;opacity:.4}.agents{max-height:650px;overflow:auto;padding:0 9px 12px}.agent{display:block;width:100%;text-align:left;border:0;background:none;border-radius:7px;padding:10px;color:var(--ink);overflow-wrap:anywhere}.agent.active{background:#e3eee5;color:var(--green)}.agent:hover{background:#eff4ed}.agent small{display:block;color:var(--muted);font:10px monospace}.count{float:right;padding:0 6px;background:#eef2eb;border-radius:4px;font-size:11px}.legend{padding:0 15px 14px;font-size:11px;color:var(--muted)}.tabs{display:flex;gap:23px;padding:0 22px;border-bottom:1px solid var(--line)}.tab{padding:17px 0;border:0;background:none;color:var(--muted)}.tab.active{border-bottom:2px solid var(--green);color:var(--green)}.content{padding:22px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.toolbar input{flex:1;min-width:140px}.path{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:18px 0}.step{font:11px monospace;padding:8px 10px;border:1px solid #d6e4d9;border-radius:7px;background:#edf4ed;overflow-wrap:anywhere}table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px}th{text-align:left;text-transform:uppercase;font-size:10px;color:var(--muted);letter-spacing:.5px}th,td{padding:12px 7px;border-bottom:1px solid #e9eee7;overflow-wrap:anywhere}.mono{font:11px monospace}.pill{padding:3px 6px;font-size:10px;border-radius:5px;background:#eaf2e9}.pill.error{background:#fae4db;color:#943d29}.pill.unknown{background:#fff0d1;color:#8c6019}.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}.empty{padding:30px 0;color:var(--muted)}pre{padding:18px;background:#f1f5ef;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}footer{margin:24px 0;font-size:11px;color:var(--muted)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:2px}@media(max-width:850px){main{padding:18px}.workspace{grid-template-columns:1fr}.agents{max-height:220px}.metrics{grid-template-columns:repeat(2,1fr)}.local{display:none}h2{font-size:26px}.content{padding:15px}.intro{align-items:flex-start}}
.deviation{color:#c62828;font-weight:600}#comparison .mono{overflow-wrap:anywhere}.report-details{margin-top:20px}.report-details>details{border:1px solid var(--line);border-radius:10px;background:white;padding:12px 18px;margin-top:10px}.report-details summary{cursor:pointer;font-weight:600}.report-details ul{margin:10px 0 2px;padding-left:20px}.report-details li{overflow-wrap:anywhere}.comparison-list{margin:8px 0 0;padding-left:20px}
</style></head>
