name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Run tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s examples/customer_review -p 'test_*.py' -v
      - name: Build package
        run: python -m build

  hermes-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Hermes CLI
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh \
            | bash -s -- --non-interactive --skip-browser --skip-computer-use
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          hermes --version
      - name: Validate native plugin
        run: hermes plugins validate .
      - name: Run plugin doctor in CI mode
        run: hermes plugins doctor . --ci
